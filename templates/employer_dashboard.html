<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='employer_dashboard.css') }}">
</head>
<body>
    <h1>Employer Dashboard</h1>
    <nav>
        <a href="/post_job">Post a Job</a>
        <a href="/logout">Logout</a>
        <a href="/create_profile">Profile</a>
    </nav>

    <h2>My Jobs</h2>
    <table>
        <thead>
            <tr>
                <th>Job Title</th>
                <th>Applications</th>
                <th>View Applications</th>
            </tr>
        </thead>
        <tbody>
            {% for job in jobs %}
            <tr>
                <td>{{ job.title }}</td>
                <td>{{ job.application_count }}</td>
                <td><a href="/job_applications/{{ job.id }}">View Applications</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
